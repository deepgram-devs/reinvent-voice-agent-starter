[project]
name = "reinvent-pipecat-agent"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = ["pipecat-ai[deepgram]==1.17.0", "aiohttp>=3.12,<4", "httpx>=0.28,<0.29", "openai>=2,<4", "python-dotenv>=1,<2"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.14,<1"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff.lint]
select = ["E9", "F"]
