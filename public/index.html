<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Voice agent starter</title>
<style>
  :root { --bg:#0b0b0c; --panel:#16161a; --text:#fcfaf8; --muted:#9a98a0; --accent:#13ef93; --agent:#a78bfa; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--text); font:16px/1.5 system-ui, sans-serif;
         display:flex; flex-direction:column; align-items:center; padding:48px 16px; gap:24px; }
  h1 { margin:0; font-size:28px; font-weight:600; }
  p.lead { margin:0; color:var(--muted); text-align:center; max-width:520px; }
  #dot { width:120px; height:120px; border-radius:50%; background:var(--panel); border:2px solid #2a2a30;
         transition:transform .15s, border-color .15s, box-shadow .15s; }
  body[data-state="listening"] #dot { border-color:var(--accent); box-shadow:0 0 32px #13ef9333; }
  body[data-state="user"] #dot { border-color:var(--accent); transform:scale(1.08); box-shadow:0 0 48px #13ef9366; }
  body[data-state="agent"] #dot { border-color:var(--agent); transform:scale(1.08); box-shadow:0 0 48px #a78bfa66; }
  #state { color:var(--muted); font-size:14px; min-height:1.5em; }
  button { font:600 16px system-ui; padding:12px 28px; border-radius:999px; border:0; cursor:pointer;
           background:var(--accent); color:#000; }
  button.stop { background:#2a2a30; color:var(--text); }
  #log { width:100%; max-width:640px; display:flex; flex-direction:column; gap:8px; }
  .line { padding:10px 14px; border-radius:12px; background:var(--panel); }
  .line b { display:block; font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); }
  .line.agent b { color:var(--agent); } .line.user b { color:var(--accent); }
</style>
</head>
<body data-state="idle">
  <h1>Voice agent starter</h1>
  <p class="lead">Flux listens, Think-Fast replies, Flux TTS speaks, all on Deepgram's Voice Agent API.
    Pause mid-sentence and it waits. Talk over it and it stops.</p>
  <div id="dot"></div>
  <div id="state">Press Start and allow the microphone.</div>
  <button id="go">Start</button>
  <div id="log"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
